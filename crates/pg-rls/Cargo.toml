[package]
name = "pg-rls"
version = "0.2.0"
description = "Postgres RLS for sqlx — with the foot-guns already caught. Tenant-isolation helpers, boot-time audit, canonical policy SQL. Axum middleware behind the default `axum` feature."
documentation = "https://docs.rs/pg-rls"
keywords = ["multi-tenant", "sqlx", "postgres", "rls", "axum"]
categories = ["web-programming", "database", "asynchronous"]
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[features]
default = ["axum"]
axum = ["dep:axum"]

[dependencies]
axum = { workspace = true, optional = true }
sqlx = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
proptest = "1"

[[test]]
name = "smoke"
required-features = ["axum"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
