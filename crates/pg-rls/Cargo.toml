[package]
name = "pg-rls"
version = "0.1.0"
description = "Tenant-isolation helpers for sqlx + Postgres apps that use row-level security. Axum middleware included."
documentation = "https://docs.rs/pg-rls"
keywords = ["multi-tenant", "sqlx", "postgres", "rls", "axum"]
categories = ["web-programming", "database", "asynchronous"]
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[dependencies]
axum = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
