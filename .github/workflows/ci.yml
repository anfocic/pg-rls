name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mtap
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Provision non-superuser app role
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -p 5433 -U postgres -d mtap -f docker/init.sql
      - name: cargo test (default features)
        env:
          DATABASE_URL: postgres://mtap_app:mtap_app@localhost:5433/mtap
        run: cargo test --workspace --all-targets
      - name: cargo test (no default features) - core only
        run: cargo test -p pg-rls --no-default-features --lib --tests
      - name: smoke test
        env:
          DATABASE_URL: postgres://mtap_app:mtap_app@localhost:5433/mtap
        run: cargo test -p pg-rls --test smoke

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  semver-checks:
    name: semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compares the PR's public API with main. The action's default baseline is
      # the latest crates.io release, which fails while nothing is published.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: pg-rls
          baseline-rev: main

  msrv:
    name: msrv (1.88)
    # Verifies the declared rust-version in Cargo.toml actually compiles.
    # Bump in lockstep with the field. The floor is set by transitive
    # deps (notably the `home` crate at the time of writing); revisit
    # if our direct deps drop their MSRV.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p pg-rls --all-targets

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # RUSTSEC-2026-0459: libsqlite3-sys bundles a vulnerable SQLite. It is in
      # Cargo.lock only as sqlx 0.8's optional sqlite driver, which we never
      # enable: `cargo tree --workspace --target all -e all -i libsqlite3-sys`
      # finds it in no build. The fixed 0.39 line needs sqlx 0.9 (PR #4).
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2026-0459
