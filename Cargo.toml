[workspace]
resolver = "2"
members = [
    "crates/pg-rls",
    "examples/rls",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/anfocic/pg-rls"
homepage = "https://github.com/anfocic/pg-rls"
authors = ["Andrej Focic"]
rust-version = "1.88"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tower = "0.5"
